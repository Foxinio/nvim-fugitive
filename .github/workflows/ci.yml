name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (nvim ${{ matrix.nvim }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [stable, nightly]
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - run: git --version
      - run: make test

  git-2-40:
    name: test (git 2.40)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Build git 2.40
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libexpat1-dev gettext libz-dev libssl-dev
          curl -sL https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.40.0.tar.gz | tar xz
          make -C git-2.40.0 -j4 prefix=/usr/local NO_TCLTK=1 all >/dev/null
          sudo make -C git-2.40.0 prefix=/usr/local NO_TCLTK=1 install >/dev/null
      - run: git --version | grep -q '2\.40\.'
      - run: make test

  parity:
    name: parity with upstream vim-fugitive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tpope/vim-fugitive
          path: upstream
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: make parity UPSTREAM=upstream

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.0.2
          args: --check lua plugin tests
      - uses: NTBBloodbath/selene-action@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: lua plugin
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: lua-language-server
        run: |
          mkdir -p /tmp/luals
          curl -sL https://github.com/LuaLS/lua-language-server/releases/download/3.13.5/lua-language-server-3.13.5-linux-x64.tar.gz | tar xz -C /tmp/luals
          make deps
          export VIMRUNTIME=$(nvim --headless --clean -c 'lua io.stdout:write(vim.env.VIMRUNTIME)' -c 'qa!')
          /tmp/luals/bin/lua-language-server --check lua --configpath=$PWD/.luarc.json --checklevel=Warning --logpath=/tmp/luals-log | tee /tmp/luals.out
          # lua-language-server exits 0 even when it finds problems
          grep -q "no problems found" /tmp/luals.out
